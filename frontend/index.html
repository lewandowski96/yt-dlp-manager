<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful, cross-platform desktop UI for yt-dlp. Download videos and audio from YouTube and hundreds of other sites.">
    <title>yt-dlp Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Animated background blobs -->
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </div>
                <h1>yt-dlp <span class="text-gradient">Manager</span></h1>
            </div>
            <div class="header-actions">
                <button id="btn-open-downloads" class="btn btn-ghost" title="Open downloads folder">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Downloads</span>
                </button>
            </div>
        </header>

        <!-- URL Input Section -->
        <section class="url-section glass-card">
            <div class="input-group">
                <div class="input-wrapper">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input
                        type="url"
                        id="url-input"
                        placeholder="Paste a video URL here..."
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <button id="btn-clear-url" class="btn-icon btn-clear" title="Clear" style="display:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <button id="btn-fetch" class="btn btn-primary">
                    <span class="btn-text">Fetch Info</span>
                    <div class="btn-loader" style="display:none;">
                        <div class="spinner"></div>
                    </div>
                </button>
            </div>
            <p class="url-hint">Supports YouTube, Vimeo, Twitter/X, Instagram, TikTok, and <a href="https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md" target="_blank" rel="noopener">1800+ other sites</a></p>
        </section>

        <!-- Download Destination Bar -->
        <div class="dest-bar glass-card">
            <div class="dest-bar-inner">
                <div class="dest-info">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="dest-label">Save to:</span>
                    <span id="dest-path" class="dest-path" title="">Loading...</span>
                </div>
                <button id="btn-change-dest" class="btn btn-ghost btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                    Change
                </button>
            </div>
        </div>

        <!-- Error Banner -->
        <div id="error-banner" class="error-banner" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="error-text"></span>
            <button id="btn-dismiss-error" class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- Video Info + Format Selection -->
        <section id="video-section" class="video-section" style="display:none;">
            <!-- Video Preview Card -->
            <div class="video-preview glass-card">
                <div class="video-thumbnail-wrap">
                    <img id="video-thumbnail" src="" alt="Video thumbnail" />
                    <div class="video-duration" id="video-duration"></div>
                </div>
                <div class="video-meta">
                    <h2 id="video-title" class="video-title"></h2>
                    <p id="video-channel" class="video-channel"></p>
                </div>
            </div>

            <!-- Preset Quick Picks -->
            <div class="presets-section glass-card">
                <h3 class="section-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    Quick Download
                </h3>
                <div id="presets-grid" class="presets-grid"></div>
            </div>

            <!-- Advanced Format Picker (collapsed by default) -->
            <div class="formats-section glass-card">
                <button id="btn-toggle-formats" class="formats-toggle">
                    <h3 class="section-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        Advanced Format Selection
                    </h3>
                    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div id="formats-content" class="formats-content" style="display:none;">
                    <div class="formats-filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="video+audio">Video+Audio</button>
                        <button class="filter-btn" data-filter="video">Video Only</button>
                        <button class="filter-btn" data-filter="audio">Audio Only</button>
                    </div>
                    <div class="formats-table-wrap">
                        <table class="formats-table">
                            <thead>
                                <tr>
                                    <th>Format</th>
                                    <th>Extension</th>
                                    <th>Resolution</th>
                                    <th>FPS</th>
                                    <th>Size</th>
                                    <th>Type</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="formats-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- Download Progress Section -->
        <section id="download-section" class="download-section" style="display:none;">
            <div class="download-card glass-card">
                <div class="download-header">
                    <div class="download-status-icon" id="download-status-icon">
                        <div class="spinner-large"></div>
                    </div>
                    <div class="download-info">
                        <h3 id="download-status-text">Downloading...</h3>
                        <p id="download-filename" class="download-filename"></p>
                    </div>
                </div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
                        <div class="progress-bar-glow" id="progress-bar-glow"></div>
                    </div>
                    <div class="progress-stats">
                        <span id="progress-percent">0%</span>
                        <span id="progress-speed"></span>
                        <span id="progress-eta"></span>
                    </div>
                </div>
                <div class="download-actions">
                    <button id="btn-cancel-download" class="btn btn-danger">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        Cancel
                    </button>
                </div>
            </div>
        </section>

        <!-- Download Complete Section -->
        <section id="complete-section" class="complete-section" style="display:none;">
            <div class="complete-card glass-card">
                <div class="complete-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <h3>Download Complete!</h3>
                <p id="complete-filename" class="download-filename"></p>
                <div class="complete-actions">
                    <button id="btn-open-folder" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        Open Folder
                    </button>
                    <button id="btn-download-another" class="btn btn-ghost">
                        Download Another
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- Directory Browser Modal -->
    <div id="dir-modal" class="modal-overlay" style="display:none;">
        <div class="modal glass-card">
            <div class="modal-header">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    Choose Download Folder
                </h3>
                <button id="btn-close-modal" class="btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- Path Input -->
            <div class="modal-path-input">
                <input type="text" id="dir-path-input" placeholder="Type a path..." spellcheck="false" />
                <button id="btn-go-path" class="btn btn-ghost btn-sm">Go</button>
            </div>

            <!-- Current path breadcrumb -->
            <div id="dir-current-path" class="dir-current-path"></div>

            <!-- Directory listing -->
            <div id="dir-listing" class="dir-listing">
                <div class="dir-loading">
                    <div class="spinner"></div>
                    <span>Loading...</span>
                </div>
            </div>

            <!-- Modal actions -->
            <div class="modal-actions">
                <button id="btn-dir-cancel" class="btn btn-ghost">Cancel</button>
                <button id="btn-dir-select" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Select This Folder
                </button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
